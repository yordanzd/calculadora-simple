<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Calculadora</title>
</head>

<body>
    <header>
        <h1>Calculadora Simple</h1>
        <p>Una calculadora basica para realizar operaciones matematicas facilmente</p>
    </header>
    <main>
        <div class="calculadora">
            <div class="resultados">
                <h2 id="pantalla"></h2>
            </div>

            <div class="botones">
                <button>7</button>
                <button>8</button>
                <button>9</button>


                <button>4</button>
                <button>5</button>
                <button>6</button>


                <button>1</button>
                <button>2</button>
                <button>3</button>

                <button>.</button>
                <button>0</button>

                <button class="limpiar">C</button>
                <button class="operador">+</button>
                <button class="operador">-</button>
                <button class="operador">/</button>

                <button class="operador">*</button>
                <button class="igual">=</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
